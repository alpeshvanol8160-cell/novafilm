<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaFilm AI - Cinematic Film & Documentary Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
    .gold-glow { box-shadow: 0 0 15px rgba(234, 179, 8, 0.2); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="border-b border-gray-800 bg-black/40 backdrop-blur p-4 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🎬</span>
      <h1 class="text-xl font-bold bg-gradient-to-r from-yellow-400 to-amber-600 bg-clip-text text-transparent">
        NovaFilm AI
      </h1>
    </div>
    <button class="bg-amber-500 hover:bg-amber-600 text-black font-semibold px-4 py-1.5 rounded-lg text-sm">
      Go Pro (4K)
    </button>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">

    <!-- Mode Switcher -->
    <div class="bg-gray-900 p-1.5 rounded-xl flex border border-gray-800">
      <button class="flex-1 py-2 text-center rounded-lg bg-gray-800 text-amber-400 font-medium text-sm">
        📹 Documentary Mode
      </button>
      <button class="flex-1 py-2 text-center rounded-lg text-gray-400 hover:text-white font-medium text-sm">
        ✨ 3D Movie Studio (PRO)
      </button>
    </div>

    <!-- Style Presets -->
    <div>
      <label class="block text-sm font-semibold text-gray-400 mb-2">Visual Preset Style</label>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-gray-900 border-2 border-amber-500/80 p-3 rounded-xl cursor-pointer text-center gold-glow">
          <div class="text-2xl mb-1">🏰</div>
          <div class="text-xs font-bold text-amber-400">LOTR Fantasy</div>
        </div>
        <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl cursor-pointer text-center hover:border-gray-700">
          <div class="text-2xl mb-1">🦁</div>
          <div class="text-xs font-medium text-gray-300">Lion King Wildlife</div>
        </div>
        <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl cursor-pointer text-center hover:border-gray-700">
          <div class="text-2xl mb-1">🏛️</div>
          <div class="text-xs font-medium text-gray-300">Dark Academia</div>
        </div>
        <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl cursor-pointer text-center hover:border-gray-700">
          <div class="text-2xl mb-1">🚀</div>
          <div class="text-xs font-medium text-gray-300">Sci-Fi Cyber</div>
        </div>
      </div>
    </div>

    <!-- Character Studio -->
    <div class="bg-gray-900/60 border border-gray-800 rounded-xl p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-gray-200">✨ Custom Character Builder (Lock Angle)</h3>
        <span class="text-xs text-amber-500 font-medium">Pro Lock Enabled</span>
      </div>
      <input type="text" 
             placeholder="Describe character... e.g. An ancient elf warrior with silver hair and glowing sword" 
             class="w-full bg-black/60 border border-gray-800 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-500 text-gray-200" />
      <div class="grid grid-cols-3 gap-2">
        <div class="h-20 bg-gray-950 border border-dashed border-gray-800 rounded-lg flex items-center justify-center text-xs text-gray-600">Front View</div>
        <div class="h-20 bg-gray-950 border border-dashed border-gray-800 rounded-lg flex items-center justify-center text-xs text-gray-600">Side View</div>
        <div class="h-20 bg-gray-950 border border-dashed border-gray-800 rounded-lg flex items-center justify-center text-xs text-gray-600">Action Angle</div>
      </div>
    </div>

    <!-- Script Input -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-400">Movie Script / Story Prompt</label>
      <textarea rows="4" 
                placeholder="Write your story scene prompt here..." 
                class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-gray-200"></textarea>
    </div>

    <!-- Action Button -->
    <button class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-black font-bold py-3.5 rounded-xl shadow-lg shadow-amber-500/10">
      🎬 Generate 4K Cinematic Movie
    </button>

    <!-- Player Preview Placeholder -->
    <div class="aspect-video bg-gray-950 border border-gray-800 rounded-xl flex flex-col items-center justify-center space-y-2 text-gray-500">
      <div class="text-3xl">▶️</div>
      <p class="text-sm">Video output preview will appear here in 4K</p>
    </div>

  </main>
</body>
</html>
