<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaFilm AI - YouTube & Cinematic Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #080c14; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .gold-glow { box-shadow: 0 0 15px rgba(245, 158, 11, 0.25); }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

  <!-- Navbar -->
  <header class="border-b border-gray-800 bg-black/60 backdrop-blur p-4 sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🎬</span>
      <h1 class="text-xl font-black bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-600 bg-clip-text text-transparent">
        NovaFilm AI
      </h1>
      <span class="bg-amber-500/10 text-amber-400 text-xs px-2 py-0.5 rounded border border-amber-500/20">YouTube Studio</span>
    </div>
    <button class="bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-bold px-4 py-1.5 rounded-lg text-sm shadow-md hover:brightness-110">
      Pro Access (4K)
    </button>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">

    <!-- Mode Switcher -->
    <div class="bg-gray-900/90 p-1.5 rounded-xl flex border border-gray-800">
      <button id="docModeBtn" onclick="switchMode('doc')" class="flex-1 py-2 text-center rounded-lg bg-gray-800 text-amber-400 font-semibold text-sm transition">
        🎙️ YouTube Documentary Engine
      </button>
      <button id="cgiModeBtn" onclick="switchMode('cgi')" class="flex-1 py-2 text-center rounded-lg text-gray-400 hover:text-white font-semibold text-sm transition">
        💥 3D CGI Movie & VFX Studio
      </button>
    </div>

    <!-- YouTube & Video Format Settings -->
    <div class="glass-card border border-gray-800 rounded-xl p-4 space-y-4">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Video & Format Settings</h3>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <div>
          <label class="text-xs text-gray-400 block mb-1">Aspect Ratio</label>
          <select id="aspectRatio" class="w-full bg-gray-950 border border-gray-800 text-xs rounded-lg p-2.5 text-gray-200">
            <option value="16:9">16:9 (YouTube Landscape)</option>
            <option value="9:16">9:16 (YouTube Shorts / Reels)</option>
            <option value="21:9">21:9 (Cinematic Widescreen)</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">AI Voiceover Narrator</label>
          <select id="voiceStyle" class="w-full bg-gray-950 border border-gray-800 text-xs rounded-lg p-2.5 text-gray-200">
            <option value="Deep Documentary (BBC Style)">Deep Documentary (Attenborough Style)</option>
            <option value="Dramatic Movie Trailer Voice">Dramatic Movie Trailer Voice</option>
            <option value="Epic Fantasy Narrator">Epic Fantasy Narrator</option>
            <option value="Sci-Fi AI Assistant">Sci-Fi AI Assistant</option>
          </select>
        </div>
        <div class="col-span-2 md:col-span-1">
          <label class="text-xs text-gray-400 block mb-1">Render Resolution</label>
          <select class="w-full bg-gray-950 border border-gray-800 text-xs rounded-lg p-2.5 text-amber-400 font-semibold">
            <option>4K Ultra HD (60 FPS)</option>
            <option>1080p Full HD</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Visual Presets -->
    <div>
      <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Visual & CGI Styles</label>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div onclick="selectPreset('LOTR Cinematic')" class="glass-card border-2 border-amber-500/80 p-3 rounded-xl cursor-pointer text-center gold-glow">
          <div class="text-2xl mb-1">🏰</div>
          <div class="text-xs font-bold text-amber-400">LOTR Cinematic</div>
        </div>
        <div onclick="selectPreset('Unreal 5 CGI VFX')" class="glass-card border border-gray-800 p-3 rounded-xl cursor-pointer text-center hover:border-gray-700">
          <div class="text-2xl mb-1">💥</div>
          <div class="text-xs font-medium text-gray-300">Unreal 5 CGI VFX</div>
        </div>
        <div onclick="selectPreset('Photorealistic Wildlife')" class="glass-card border border-gray-800 p-3 rounded-xl cursor-pointer text-center hover:border-gray-700">
          <div class="text-2xl mb-1">🦁</div>
          <div class="text-xs font-medium text-gray-300">Lion King Wildlife</div>
        </div>
        <div onclick="selectPreset('Dark Academia History')" class="glass-card border border-gray-800 p-3 rounded-xl cursor-pointer text-center hover:border-gray-700">
          <div class="text-2xl mb-1">📜</div>
          <div class="text-xs font-medium text-gray-300">History Docu</div>
        </div>
      </div>
    </div>

    <!-- Script Input -->
    <div class="space-y-2">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">YouTube Script / Documentary Topic</label>
        <span class="text-xs text-amber-500">Auto-Storyboard Active</span>
      </div>
      <textarea id="scriptInput" rows="5" 
                placeholder="Enter your video concept or script here... (e.g. A mystery documentary about the ancient Roman lost legion in the desert)" 
                class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3.5 text-sm focus:outline-none focus:border-amber-500 text-gray-200 leading-relaxed"></textarea>
    </div>

    <!-- Generate Button -->
    <button onclick="generateCinematicMovie()" class="w-full bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 hover:brightness-110 text-black font-extrabold py-4 rounded-xl shadow-lg shadow-amber-500/10 text-base">
      🚀 Generate YouTube Documentary & Storyboard
    </button>

    <!-- Output Box -->
    <div id="playerBox" class="glass-card border border-gray-800 rounded-xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h4 class="text-sm font-bold text-gray-300">Production Preview & Render Logs</h4>
        <span id="badgeStatus" class="bg-gray-800 text-xs px-2 py-1 rounded text-gray-400">Idle</span>
      </div>
      
      <div id="playerStatus" class="text-center py-6 text-gray-500 text-sm">
        Enter script and click generate to process 4K video frames & audio.
      </div>

      <div id="storyboardOutput" class="hidden space-y-3">
        <div class="text-xs font-semibold text-amber-400">Generated YouTube Scenes & Voice Sync:</div>
        <div id="sceneContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </div>

  </main>

  <script>
    let activePreset = "LOTR Cinematic";
    let activeMode = "YouTube Documentary";

    function switchMode(mode) {
      const docBtn = document.getElementById('docModeBtn');
      const cgiBtn = document.getElementById('cgiModeBtn');
      if(mode === 'cgi') {
        activeMode = "3D CGI Movie & VFX Studio";
        cgiBtn.className = "flex-1 py-2 text-center rounded-lg bg-gray-800 text-amber-400 font-semibold text-sm";
        docBtn.className = "flex-1 py-2 text-center rounded-lg text-gray-400 hover:text-white font-semibold text-sm";
      } else {
        activeMode = "YouTube Documentary";
        docBtn.className = "flex-1 py-2 text-center rounded-lg bg-gray-800 text-amber-400 font-semibold text-sm";
        cgiBtn.className = "flex-1 py-2 text-center rounded-lg text-gray-400 hover:text-white font-semibold text-sm";
      }
    }

    function selectPreset(presetName) {
      activePreset = presetName;
      alert("Selected Style Preset: " + presetName);
    }

    function generateCinematicMovie() {
      const script = document.getElementById('scriptInput').value;
      const playerStatus = document.getElementById('playerStatus');
      const storyboardOutput = document.getElementById('storyboardOutput');
      const sceneContainer = document.getElementById('sceneContainer');
      const badgeStatus = document.getElementById('badgeStatus');

      if(!script) {
        alert("Kripya pehle YouTube video ki script ya story topic enter karein!");
        return;
      }

      badgeStatus.className = "bg-amber-500/20 text-amber-400 text-xs px-2 py-1 rounded border border-amber-500/40 animate-pulse";
      badgeStatus.innerText = "Rendering";
      playerStatus.innerText = "⏳ Splitting script into cinematic YouTube scenes & matching voiceover...";

      setTimeout(() => {
        badgeStatus.className = "bg-green-500/20 text-green-400 text-xs px-2 py-1 rounded border border-green-500/40";
        badgeStatus.innerText = "Ready 4K";
        playerStatus.innerText = "✅ Video Storyboard & Voice Script Ready!";
        
        storyboardOutput.classList.remove('hidden');
        
        const aspect = document.getElementById('aspectRatio').value;
        const voice = document.getElementById('voiceStyle').value;

        sceneContainer.innerHTML = `
          <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 text-xs space-y-1">
            <div class="text-amber-400 font-bold">Scene 1 (Hook - 00:00 to 00:05)</div>
            <p class="text-gray-300">"${script.substring(0, 60)}..."</p>
            <div class="text-gray-500 pt-1"><strong>Format:</strong> ${aspect} | <strong>Voice:</strong> ${voice}</div>
          </div>
          <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 text-xs space-y-1">
            <div class="text-amber-400 font-bold">Scene 2 (Visual FX Prompt)</div>
            <p class="text-gray-300">${script.substring(0, 40)}, photorealistic 8k, ${activePreset} style, master cinematic lighting.</p>
            <div class="text-gray-500 pt-1"><strong>Mode:</strong> ${activeMode}</div>
          </div>
        `;
      }, 1500);
    }
  </script>

</body>
</html>
